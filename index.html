<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Color By Number Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #121212; --ui: #1e1e1e; --accent: #00adb5; --text: #eeeeee; }
        body { margin: 0; padding: 0; background: var(--bg); font-family: system-ui, sans-serif; color: var(--text); height: 100vh; overflow: hidden; user-select: none; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .screen.active { display: flex; }

        #auth-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .auth-card { background: var(--ui); padding: 30px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #333; }
        .auth-card input { background: #121212; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; }

        #home-screen { padding: 30px; padding-top: max(30px, env(safe-area-inset-top)); box-sizing: border-box; overflow-y: auto; height: 100vh; }
        .controls-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; justify-content: space-between; flex-wrap: wrap; }
        .tab-container { display: flex; gap: 10px; }
        .tab-btn { background: #25252b; color: #888; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); color: #fff; }

        .select-btn { background: #222; color: var(--text); border: 1px solid #444; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .url-input-container { display: none; gap: 10px; margin-bottom: 20px; }
        .url-input-container.active { display: flex; }
        .url-input-container input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .level-card { background: var(--ui); border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        #header { height: 50px; background: var(--ui); display: flex; align-items: center; padding: 0 15px; padding-top: env(safe-area-inset-top); justify-content: space-between; border-bottom: 1px solid #333; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-mode { background: #333; border: 1px solid #555; }
        .btn-mode.active { background: #e74c3c; border-color: #e74c3c; }

        #main-layout { flex: 1; position: relative; background: #151515; overflow: hidden; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
        
        #palette-wrapper { background: var(--ui); border-top: 1px solid #333; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); }
        #palette-wrapper.hidden { display: none; }
        #palette-bar { height: 146px; display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 5px; padding: 8px; overflow-y: auto; box-sizing: border-box; }
        .swatch { height: 40px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #000; border: 2px solid transparent; }
        .swatch.selected { border-color: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h3 style="margin:0">Cloud Studio Login</h3>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button class="btn" onclick="handleAuth('login')">Sign In</button>
            <button class="btn" style="background:#333" onclick="handleAuth('signup')">Register</button>
            <button class="btn" style="background:#222; font-size:12px" onclick="bypassAuth()">Play Offline (Local Only)</button>
        </div>
    </div>

    <div id="home-screen" class="screen active">
        <div class="controls-row">
            <div class="tab-container" id="category-tabs"></div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <select id="size-select" class="select-btn" onchange="updateGridDimensions(this.value)">
                    <option value="150">Grid: 150x150</option>
                    <option value="200">Grid: 200x200</option>
                    <option value="250">Grid: 250x250</option>
                    <option value="300">Grid: 300x300</option>
                </select>
                <select id="subject-select" class="select-btn" onchange="renderPortfolioGallery()">
                    <option value="general">Subject: General</option>
                    <option value="landscape">Subject: Landscape</option>
                    <option value="animals">Subject: Animals</option>
                    <option value="architecture">Subject: Architecture</option>
                    <option value="abstract">Subject: Abstract</option>
                </select>
                <select id="theme-select" class="select-btn" onchange="changeTheme(this.value)">
                    <option value="all">Palette: All</option>
                    <option value="warm">Palette: Warm</option>
                    <option value="cool">Palette: Cool</option>
                    <option value="pastel">Palette: Pastel</option>
                    <option value="neon">Palette: Neon</option>
                    <option value="grayscale">Palette: Grayscale</option>
                </select>
                <span id="user-status" style="font-size:12px; color:#888">Offline Mode</span>
                <button class="btn" style="background:#444" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div id="custom-url-container" class="url-input-container">
            <input type="text" id="custom-image-url" placeholder="Paste image URL for current level...">
            <button class="btn" onclick="loadCustomUrlFromInput()">Load Photo</button>
        </div>

        <h3>In Progress</h3>
        <div id="in-progress-gallery" class="gallery-grid"></div>
        <h3>Completed</h3>
        <div id="completed-gallery" class="gallery-grid"></div>
    </div>

    <div id="game-screen" class="screen">
        <div id="header">
            <div>
                <button class="btn" onclick="returnToGallery()">← Gallery</button>
                <span id="level-title" style="margin-left:10px; font-weight:bold;">Mandala #1</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="triggerHint()">Hint</button>
                <button class="btn" onclick="toggleFullscreen()">Full Screen</button>
                <button class="btn" id="palette-toggle-btn" onclick="togglePalette()">Hide Palette</button>
                <button class="btn btn-mode" id="mode-toggle" onclick="toggleInteractionMode()">Mode: PAINT</button>
                <button class="btn" onclick="moveLevel(-1)">Prev</button>
                <button class="btn" onclick="moveLevel(1)">Next</button>
            </div>
        </div>
        <div id="main-layout">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="palette-wrapper">
            <div id="palette-bar"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ecwdxhcxyuutyxzjjhbi.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DOqW6Lf_dk5E19SUwIRkiA_fjAkD0Gf";
        
        const supabaseClient = (SUPABASE_URL && !SUPABASE_URL.includes("YOUR_SUPABASE")) 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        let GRID_SIZE = 150;
        const TOTAL_LEVELS = 10000;
        const TARGET_COLORS_COUNT = 160;

        let activeTheme = 'all';
        let currentUser = null;
        let currentCategory = 'mandala';
        let currentLevel = 0;
        let activeColorId = 1;
        let customImageUrl = "";
        let isLevelLoaded = false;
        let realtimeChannel = null;

        let isPanMode = false;
        let colorPalette = [];
        let rgbPaletteParsed = [];
        let answerGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
        let userGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let viewTransform = { x: 0, y: 0, zoom: 1 };
        
        let activePointers = new Map();
        let initialPinchDist = null;
        let initialZoom = 1;
        let isDragging = false;
        let isPanning = false;
        let lastPointerPos = { x: 0, y: 0 };
        let saveTimeout = null;

        function updateGridDimensions(val) {
            GRID_SIZE = parseInt(val, 10);
            answerGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
            userGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
            renderPortfolioGallery();
        }

        function getStorageKey(category, levelIndex) {
            const userId = currentUser ? currentUser.id : 'guest';
            return `grid_save_${userId}_${category}_${levelIndex}_${GRID_SIZE}`;
        }

        function getLevelTheme(levelIdx) {
            const themeKeys = ['warm', 'cool', 'pastel', 'neon', 'grayscale'];
            return themeKeys[levelIdx % themeKeys.length];
        }

        function changeTheme(themeKey) {
            activeTheme = themeKey;
            renderPortfolioGallery();
        }

        function togglePalette() {
            const wrapper = document.getElementById('palette-wrapper');
            const btn = document.getElementById('palette-toggle-btn');
            const isHidden = wrapper.classList.toggle('hidden');
            if (btn) btn.textContent = isHidden ? 'Show Palette' : 'Hide Palette';
            resizeCanvas();
            draw();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function triggerHint() {
            if (!isLevelLoaded) return;
            let targetIdx = -1;

            for (let i = 0; i < answerGrid.length; i++) {
                if (userGrid[i] === 0 && answerGrid[i] === activeColorId) {
                    targetIdx = i;
                    break;
                }
            }

            if (targetIdx === -1) {
                for (let i = 0; i < answerGrid.length; i++) {
                    if (userGrid[i] === 0) {
                        targetIdx = i;
                        activeColorId = answerGrid[i];
                        generatePaletteUI();
                        break;
                    }
                }
            }

            if (targetIdx === -1) return;

            const gx = targetIdx % GRID_SIZE;
            const gy = Math.floor(targetIdx / GRID_SIZE);

            viewTransform.zoom = 12;
            viewTransform.x = (canvas.width / 2) - (gx + 0.5) * viewTransform.zoom;
            viewTransform.y = (canvas.height / 2) - (gy + 0.5) * viewTransform.zoom;
            draw();
        }

        function setupRealtimeSubscription() {
            if (!supabaseClient || !currentUser) return;
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

            realtimeChannel = supabaseClient
                .channel('public:user_progress')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'user_progress',
                    filter: `user_id=eq.${currentUser.id}`
                }, (payload) => {
                    const newRow = payload.new;
                    if (newRow && newRow.category === currentCategory && newRow.level_index === currentLevel && isLevelLoaded) {
                        const indices = newRow.colored_indices || [];
                        for (let idx of indices) {
                            if (idx < userGrid.length) {
                                userGrid[idx] = answerGrid[idx];
                            }
                        }
                        draw();
                    }
                })
                .subscribe();
        }

        async function initAuthSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-status').textContent = currentUser.email;
                setupRealtimeSubscription();
                await renderPortfolioGallery();
            }

            supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                currentUser = session ? session.user : null;
                document.getElementById('user-status').textContent = currentUser ? currentUser.email : 'Offline Mode';
                if (currentUser) {
                    document.getElementById('auth-overlay').style.display = 'none';
                    setupRealtimeSubscription();
                    await renderPortfolioGallery();
                }
            });
        }

        async function handleAuth(type) {
            if (!supabaseClient) return bypassAuth();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            const { data, error } = type === 'login' 
                ? await supabaseClient.auth.signInWithPassword({ email, password })
                : await supabaseClient.auth.signUp({ email, password });

            if (error) {
                alert(error.message);
            } else {
                currentUser = data.user;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-status').textContent = currentUser.email;
                setupRealtimeSubscription();
                await renderPortfolioGallery();
            }
        }

        function bypassAuth() {
            currentUser = null;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-status').textContent = 'Offline Mode';
            renderPortfolioGallery();
        }

        function switchCategory(category) {
            currentCategory = category;
            renderCategoryTabs();
            document.getElementById('custom-url-container').classList.toggle('active', category === 'custom');
            renderPortfolioGallery();
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = `
                <button class="tab-btn ${currentCategory === 'mandala' ? 'active' : ''}" onclick="switchCategory('mandala')">Mandalas</button>
                <button class="tab-btn ${currentCategory === 'photography' ? 'active' : ''}" onclick="switchCategory('photography')">Photography</button>
                <button class="tab-btn ${currentCategory === 'custom' ? 'active' : ''}" onclick="switchCategory('custom')">Custom URL</button>
            `;
        }

        function toggleInteractionMode() {
            isPanMode = !isPanMode;
            const btn = document.getElementById('mode-toggle');
            btn.textContent = isPanMode ? "Mode: PAN" : "Mode: PAINT";
            btn.classList.toggle('active', isPanMode);
        }

        async function initLevel(levelIndex, overrideUrl = null) {
            isLevelLoaded = false;
            currentLevel = levelIndex;
            document.getElementById('level-title').textContent = `${currentCategory.toUpperCase()} #${currentLevel + 1} (${GRID_SIZE}x${GRID_SIZE})`;
            
            answerGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
            userGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);

            try {
                if (currentCategory === 'photography') {
                    const subject = document.getElementById('subject-select').value;
                    const seedTag = subject === 'general' ? currentLevel : `${subject}-${currentLevel}`;
                    await loadPhotoFromUrl(`https://picsum.photos/seed/${seedTag}/${GRID_SIZE}/${GRID_SIZE}`);
                } else if (currentCategory === 'custom') {
                    const userId = currentUser ? currentUser.id : 'guest';
                    let url = overrideUrl;
                    
                    if (!url && currentUser && supabaseClient) {
                        const { data } = await supabaseClient.from('user_progress')
                            .select('custom_url')
                            .eq('user_id', currentUser.id)
                            .eq('category', 'custom')
                            .eq('level_index', currentLevel)
                            .maybeSingle();
                        if (data && data.custom_url) url = data.custom_url;
                    }
                    
                    if (!url) {
                        url = localStorage.getItem(`custom_url_${userId}_${currentLevel}`);
                    }
                    
                    if (!url) {
                        alert(`No custom image URL provided for Level #${currentLevel + 1}`);
                        returnToGallery();
                        return;
                    }

                    customImageUrl = url;
                    localStorage.setItem(`custom_url_${userId}_${currentLevel}`, url);
                    await loadPhotoFromUrl(url);
                } else {
                    generateDeterministicData(currentLevel);
                }
            } catch(err) {
                alert("Image loading failed. Ensure URL supports cross-origin sharing (CORS).");
                returnToGallery();
                return;
            }

            await loadState();
            isLevelLoaded = true;
            resizeCanvas();
            resetViewport();
            generatePaletteUI();
            draw();
        }

        async function loadPhotoFromUrl(url) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = url;

            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error("Failed to load image. CORS restriction active."));
            });

            const offCanvas = document.createElement('canvas');
            offCanvas.width = GRID_SIZE;
            offCanvas.height = GRID_SIZE;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);

            const imgData = offCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;

            colorPalette = ['#e0e0e0'];
            rgbPaletteParsed = [[224, 224, 224]];
            const colorMap = new Map();

            for (let i = 0; i < imgData.length; i += 4) {
                if (imgData[i + 3] < 128) continue;
                const r = Math.round(imgData[i] / 16) * 16;
                const g = Math.round(imgData[i + 1] / 16) * 16;
                const b = Math.round(imgData[i + 2] / 16) * 16;
                const key = `${r},${g},${b}`;
                colorMap.set(key, (colorMap.get(key) || 0) + 1);
            }

            const sortedColors = Array.from(colorMap.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, TARGET_COLORS_COUNT);

            sortedColors.forEach(([rgbStr]) => {
                const [r, g, b] = rgbStr.split(',').map(Number);
                colorPalette.push(`rgb(${r},${g},${b})`);
                rgbPaletteParsed.push([r, g, b]);
            });

            userGrid.fill(0);
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const pIdx = (y * GRID_SIZE + x) * 4;
                    const r = imgData[pIdx];
                    const g = imgData[pIdx + 1];
                    const b = imgData[pIdx + 2];

                    let closestIdx = 1;
                    let minDist = Infinity;
                    for (let i = 1; i < rgbPaletteParsed.length; i++) {
                        const [pr, pg, pb] = rgbPaletteParsed[i];
                        const dist = (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2;
                        if (dist < minDist) {
                            minDist = dist;
                            closestIdx = i;
                        }
                    }
                    answerGrid[y * GRID_SIZE + x] = closestIdx;
                }
            }
        }

        function loadCustomUrlFromInput() {
            const input = document.getElementById('custom-image-url');
            if (!input.value) return;
            const targetUrl = input.value;
            input.value = '';
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            initLevel(currentLevel, targetUrl);
        }

        function generateDeterministicData(seed) {
            let currentSeed = (seed + 1) * 123456789;
            function nextRandom() {
                currentSeed = (currentSeed * 1664525 + 1013904223) % 4294967296;
                return currentSeed / 4294967296;
            }

            colorPalette = ['#e0e0e0'];
            rgbPaletteParsed = [[224, 224, 224]];

            for (let i = 1; i <= TARGET_COLORS_COUNT; i++) {
                const r = Math.floor(nextRandom() * 190) + 40;
                const g = Math.floor(nextRandom() * 190) + 40;
                const b = Math.floor(nextRandom() * 190) + 40;
                colorPalette.push(`rgb(${r},${g},${b})`);
                rgbPaletteParsed.push([r, g, b]);
            }

            const centerX = GRID_SIZE / 2;
            const centerY = GRID_SIZE / 2;
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    let dx = x - centerX, dy = y - centerY;
                    let r = Math.sqrt(dx * dx + dy * dy);
                    let angle = Math.atan2(dy, dx);
                    let val = (Math.sin(r * 0.8) + Math.cos(angle * 12) + 2) / 4;
                    answerGrid[y * GRID_SIZE + x] = Math.floor(val * (TARGET_COLORS_COUNT - 1)) + 1;
                }
            }
            userGrid.fill(0);
        }

        function draw() {
            if (!canvas.width) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(viewTransform.x, viewTransform.y);
            ctx.scale(viewTransform.zoom, viewTransform.zoom);

            const z = viewTransform.zoom;
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const idx = y * GRID_SIZE + x;
                    const uColor = userGrid[idx];
                    const aColor = answerGrid[idx];

                    if (uColor !== 0) {
                        ctx.fillStyle = colorPalette[uColor];
                        ctx.fillRect(x, y, 1.05, 1.05);
                    } else if (z > 4) {
                        ctx.fillStyle = (aColor === activeColorId) ? '#b0b0b0' : '#ffffff';
                        ctx.fillRect(x, y, 1.05, 1.05);
                        ctx.strokeStyle = '#ddd';
                        ctx.lineWidth = 1 / z;
                        ctx.strokeRect(x, y, 1, 1);
                        ctx.fillStyle = '#666';
                        ctx.font = '0.4px system-ui';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(aColor, x + 0.5, y + 0.5);
                    } else {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x, y, 1.05, 1.05);
                    }
                }
            }
            ctx.restore();
        }

        function getGridCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((clientX - rect.left - viewTransform.x) / viewTransform.zoom),
                y: Math.floor((clientY - rect.top - viewTransform.y) / viewTransform.zoom)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            canvas.setPointerCapture(e.pointerId);
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 2) {
                isDragging = false;
                isPanning = false;
                const p = Array.from(activePointers.values());
                initialPinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                initialZoom = viewTransform.zoom;
                return;
            }

            lastPointerPos = { x: e.clientX, y: e.clientY };
            if (isPanMode || (e.pointerType === 'mouse' && e.button !== 0)) {
                isPanning = true;
                return;
            }
            
            const coords = getGridCoords(e.clientX, e.clientY);
            if (coords.x >= 0 && coords.x < GRID_SIZE && coords.y >= 0 && coords.y < GRID_SIZE) {
                const idx = coords.y * GRID_SIZE + coords.x;
                if (userGrid[idx] === 0 && answerGrid[idx] === activeColorId) {
                    isDragging = true;
                    userGrid[idx] = activeColorId;
                    saveState(false);
                    draw();
                } else {
                    isPanning = true;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 2 && initialPinchDist) {
                const p = Array.from(activePointers.values());
                const currentDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                const factor = currentDist / initialPinchDist;
                const nextZoom = Math.min(Math.max(initialZoom * factor, 1), 50);

                const midX = (p[0].x + p[1].x) / 2;
                const midY = (p[0].y + p[1].y) / 2;
                const rect = canvas.getBoundingClientRect();
                const worldX = (midX - rect.left - viewTransform.x) / viewTransform.zoom;
                const worldY = (midY - rect.top - viewTransform.y) / viewTransform.zoom;

                viewTransform.zoom = nextZoom;
                viewTransform.x = (midX - rect.left) - worldX * viewTransform.zoom;
                viewTransform.y = (midY - rect.top) - worldY * viewTransform.zoom;
                draw();
                return;
            }

            if (isPanning) {
                viewTransform.x += e.clientX - lastPointerPos.x;
                viewTransform.y += e.clientY - lastPointerPos.y;
                draw();
            } else if (isDragging) {
                const coords = getGridCoords(e.clientX, e.clientY);
                if (coords.x >= 0 && coords.x < GRID_SIZE && coords.y >= 0 && coords.y < GRID_SIZE) {
                    const idx = coords.y * GRID_SIZE + coords.x;
                    if (userGrid[idx] === 0 && answerGrid[idx] === activeColorId) {
                        userGrid[idx] = activeColorId;
                        saveState(false);
                        draw();
                    }
                }
            }
            lastPointerPos = { x: e.clientX, y: e.clientY };
        });

        const clearPointer = (e) => {
            if (canvas.hasPointerCapture(e.pointerId)) {
                canvas.releasePointerCapture(e.pointerId);
            }
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) initialPinchDist = null;
            if (activePointers.size === 0) { isDragging = false; isPanning = false; }
        };

        canvas.addEventListener('pointerup', clearPointer);
        canvas.addEventListener('pointercancel', clearPointer);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
            const nextZoom = Math.min(Math.max(viewTransform.zoom * zoomFactor, 1), 50);
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldX = (mouseX - viewTransform.x) / viewTransform.zoom;
            const worldY = (mouseY - viewTransform.y) / viewTransform.zoom;

            viewTransform.zoom = nextZoom;
            viewTransform.x = mouseX - worldX * viewTransform.zoom;
            viewTransform.y = mouseY - worldY * viewTransform.zoom;
            draw();
        }, { passive: false });

        async function persistToCloud(coloredIndices) {
            if (!currentUser || !supabaseClient) return false;
            const payload = {
                user_id: currentUser.id,
                category: currentCategory,
                level_index: currentLevel,
                colored_indices: Array.from(coloredIndices)
            };
            if (currentCategory === 'custom' && customImageUrl) {
                payload.custom_url = customImageUrl;
            }
            
            const { error } = await supabaseClient
                .from('user_progress')
                .upsert(payload, { onConflict: 'user_id,category,level_index' });

            if (error) {
                console.error("Cloud persist failed:", error.message);
                return false;
            }
            return true;
        }

        async function saveState(immediate = false) {
            if (!isLevelLoaded) return;

            const coloredIndices = [];
            for (let i = 0; i < userGrid.length; i++) {
                if (userGrid[i] !== 0) coloredIndices.push(i);
            }
            const key = getStorageKey(currentCategory, currentLevel);
            localStorage.setItem(key, JSON.stringify(coloredIndices));

            if (currentUser && supabaseClient) {
                clearTimeout(saveTimeout);
                if (immediate) {
                    return await persistToCloud(coloredIndices);
                } else {
                    saveTimeout = setTimeout(() => persistToCloud(coloredIndices), 500);
                }
            }
        }

        async function loadState() {
            userGrid.fill(0);
            const key = getStorageKey(currentCategory, currentLevel);
            let coloredIndices = [];

            if (currentUser && supabaseClient) {
                const { data, error } = await supabaseClient.from('user_progress')
                    .select('colored_indices, custom_url')
                    .eq('user_id', currentUser.id)
                    .eq('category', currentCategory)
                    .eq('level_index', currentLevel)
                    .maybeSingle();

                if (!error && data) {
                    coloredIndices = data.colored_indices || [];
                    if (data.custom_url) customImageUrl = data.custom_url;
                    localStorage.setItem(key, JSON.stringify(coloredIndices));
                } else {
                    coloredIndices = JSON.parse(localStorage.getItem(key) || '[]');
                }
            } else {
                coloredIndices = JSON.parse(localStorage.getItem(key) || '[]');
            }

            for (let idx of coloredIndices) {
                if (idx < userGrid.length) {
                    userGrid[idx] = answerGrid[idx];
                }
            }
        }

        function resetViewport() {
            viewTransform.zoom = (Math.min(canvas.width, canvas.height) / GRID_SIZE) * 0.8;
            viewTransform.x = (canvas.width - GRID_SIZE * viewTransform.zoom) / 2;
            viewTransform.y = (canvas.height - GRID_SIZE * viewTransform.zoom) / 2;
        }

        function resizeCanvas() {
            const container = document.getElementById('main-layout');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function generatePaletteUI() {
            const bar = document.getElementById('palette-bar');
            bar.innerHTML = '';
            for (let i = 1; i < colorPalette.length; i++) {
                const swatch = document.createElement('div');
                swatch.className = `swatch ${i === activeColorId ? 'selected' : ''}`;
                swatch.style.backgroundColor = colorPalette[i];
                swatch.textContent = i;
                swatch.onclick = () => {
                    activeColorId = i;
                    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    draw();
                };
                bar.appendChild(swatch);
            }
        }

        function createLevelCard(levelIdx, progressCount) {
            const card = document.createElement('div');
            card.className = 'level-card';
            card.innerHTML = `<div>${currentCategory.toUpperCase()} #${levelIdx + 1}</div><div style="font-size:11px; color:#888">${progressCount} / ${GRID_SIZE * GRID_SIZE} px</div>`;
            card.onclick = async () => {
                document.getElementById('home-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
                await initLevel(levelIdx);
            };
            return card;
        }

        async function renderPortfolioGallery() {
            const inProgress = document.getElementById('in-progress-gallery');
            const completed = document.getElementById('completed-gallery');
            inProgress.innerHTML = ''; 
            completed.innerHTML = '';

            const progressMap = new Map();
            const userId = currentUser ? currentUser.id : 'guest';
            const prefix = `grid_save_${userId}_${currentCategory}_`;

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix) && key.endsWith(`_${GRID_SIZE}`)) {
                    const levelIdx = parseInt(key.replace(prefix, '').split('_')[0], 10);
                    if (!isNaN(levelIdx)) {
                        try {
                            const saved = JSON.parse(localStorage.getItem(key) || '[]');
                            if (saved.length > 0) progressMap.set(levelIdx, saved.length);
                        } catch(e){}
                    }
                }
            }

            if (currentUser && supabaseClient) {
                const { data, error } = await supabaseClient.from('user_progress')
                    .select('level_index, colored_indices')
                    .eq('user_id', currentUser.id)
                    .eq('category', currentCategory);

                if (!error && data) {
                    for (const row of data) {
                        const indices = row.colored_indices || [];
                        if (indices.length > 0) {
                            progressMap.set(row.level_index, indices.length);
                            localStorage.setItem(`${prefix}${row.level_index}_${GRID_SIZE}`, JSON.stringify(indices));
                        }
                    }
                }
            }

            progressMap.forEach((count, levelIdx) => {
                if (activeTheme !== 'all' && getLevelTheme(levelIdx) !== activeTheme) return;

                const card = createLevelCard(levelIdx, count);
                if (count >= GRID_SIZE * GRID_SIZE) completed.appendChild(card);
                else inProgress.appendChild(card);
            });

            for (let i = 0; i < 24; i++) {
                if (!progressMap.has(i)) {
                    if (activeTheme === 'all' || getLevelTheme(i) === activeTheme) {
                        inProgress.appendChild(createLevelCard(i, 0));
                    }
                }
            }
        }

        async function returnToGallery() {
            await saveState(true);
            isLevelLoaded = false;
            customImageUrl = "";
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('home-screen').classList.add('active');
            await renderPortfolioGallery();
        }

        async function moveLevel(dir) {
            await saveState(true);
            isLevelLoaded = false;
            customImageUrl = "";
            const next = currentLevel + dir;
            if (next >= 0 && next < TOTAL_LEVELS) await initLevel(next);
        }

        async function logout() {
            if (isLevelLoaded) {
                await saveState(true);
            }
            if (realtimeChannel && supabaseClient) {
                supabaseClient.removeChannel(realtimeChannel);
            }
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            currentUser = null;
            location.reload();
        }

        window.addEventListener('resize', () => { resizeCanvas(); draw(); });
        window.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden') await saveState(true);
        });
        window.addEventListener('pagehide', async () => await saveState(true));
        window.addEventListener('beforeunload', async () => await saveState(true));

        window.addEventListener('load', async () => {
            renderCategoryTabs();
            if (supabaseClient) {
                await initAuthSession();
            } else {
                bypassAuth();
            }
        });
    </script>
</body>
</html>
