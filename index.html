<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Color By Number Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="auth-overlay" class="modal-overlay active">
        <div class="auth-card">
            <h3 style="margin:0">Cloud Studio Login</h3>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button class="btn" onclick="handleAuth('login')">Sign In</button>
            <button class="btn" style="background:#333" onclick="handleAuth('signup')">Register</button>
            <button class="btn" style="background:#222; font-size:12px" onclick="bypassAuth()">Play Offline (Local Only)</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="auth-card" style="width: 340px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0">Studio Settings</h3>
                <button class="btn" style="background:transparent; font-size:18px; padding:2px 8px; color:#aaa" onclick="toggleSettingsModal(false)">✕</button>
            </div>
            <hr style="border:0; border-top:1px solid #333; margin: 5px 0 10px 0;">
            <div style="display:flex; flex-direction:column; gap:14px;">
                <label class="setting-row">
                    <span>Progress Percentage</span>
                    <input type="checkbox" id="set-progress" onchange="updateSetting('showProgress', this.checked)">
                </label>
                <label class="setting-row">
                    <span>Pixels Remaining</span>
                    <input type="checkbox" id="set-remaining" onchange="updateSetting('showRemaining', this.checked)">
                </label>
                <label class="setting-row">
                    <span>Time Elapsed</span>
                    <input type="checkbox" id="set-time" onchange="updateSetting('showTime', this.checked)">
                </label>
                <label class="setting-row">
                    <span>Hide/Show Palette Feature</span>
                    <input type="checkbox" id="set-palette" onchange="updateSetting('showPalette', this.checked)">
                </label>
                <label class="setting-row">
                    <span>Minimap Overlay</span>
                    <input type="checkbox" id="set-minimap" onchange="updateSetting('showMinimap', this.checked)">
                </label>
                <label class="setting-row">
                    <span>Auto Timelapse on Finish</span>
                    <input type="checkbox" id="set-timelapse" onchange="updateSetting('autoTimelapse', this.checked)">
                </label>
            </div>
            <button class="btn" style="margin-top:10px;" onclick="toggleSettingsModal(false)">Done</button>
        </div>
    </div>

    <div id="home-screen" class="screen active">
        <div class="controls-row">
            <div class="tab-container" id="category-tabs"></div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <select id="size-select" class="select-btn" onchange="updateGridDimensions(this.value)">
                    <option value="150">Grid: 150x150</option>
                    <option value="200">Grid: 200x200</option>
                    <option value="250">Grid: 250x250</option>
                    <option value="300">Grid: 300x300</option>
                </select>
                <select id="subject-select" class="select-btn" onchange="renderPortfolioGallery()">
                    <option value="general">Subject: General</option>
                    <option value="landscape">Subject: Landscape</option>
                    <option value="animals">Subject: Animals</option>
                    <option value="architecture">Subject: Architecture</option>
                    <option value="abstract">Subject: Abstract</option>
                </select>
                <select id="theme-select" class="select-btn" onchange="changeTheme(this.value)">
                    <option value="all">Palette: All</option>
                    <option value="warm">Palette: Warm</option>
                    <option value="cool">Palette: Cool</option>
                    <option value="pastel">Palette: Pastel</option>
                    <option value="neon">Palette: Neon</option>
                    <option value="grayscale">Palette: Grayscale</option>
                </select>
                <span id="user-status" style="font-size:12px; color:#888">Offline Mode</span>
                <button class="btn btn-settings" onclick="toggleSettingsModal(true)">Settings</button>
                <button class="btn" style="background:#444" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div id="custom-url-container" class="url-input-container">
            <input type="text" id="custom-image-url" placeholder="Paste image URL for current level...">
            <button class="btn" onclick="loadCustomUrlFromInput()">Load Photo</button>
        </div>

        <h3>In Progress</h3>
        <div id="in-progress-gallery" class="gallery-grid"></div>
        <h3>Completed</h3>
        <div id="completed-gallery" class="gallery-grid"></div>
    </div>

    <div id="game-screen" class="screen">
        <div id="header">
            <div>
                <button class="btn" onclick="returnToGallery()">← Gallery</button>
                <span id="level-title" style="margin-left:10px; font-weight:bold;">Mandala #1</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-hint" onclick="triggerHint()">Hint</button>
                <button class="btn btn-timelapse" onclick="playTimelapse()">Timelapse</button>
                <button class="btn btn-settings" onclick="toggleSettingsModal(true)">Settings</button>
                <button class="btn" onclick="toggleFullscreen()">Full Screen</button>
                <button class="btn btn-mode" id="mode-toggle" onclick="toggleInteractionMode()">Mode: PAINT</button>
                <button class="btn" onclick="moveLevel(-1)">Prev</button>
                <button class="btn" onclick="moveLevel(1)">Next</button>
            </div>
        </div>
        <div id="dashboard-bar">
            <div id="dash-pct-container">Progress: <span id="dash-pct">0.0%</span></div>
            <div id="dash-left-container">Remaining: <span id="dash-left">0</span> px</div>
            <div id="dash-time-container">Time Elapsed: <span id="dash-time">00:00</span></div>
        </div>
        <div id="main-layout">
            <canvas id="gameCanvas"></canvas>
            <div id="minimap-overlay">
                <canvas id="minimapCanvas" width="140" height="140"></canvas>
            </div>
        </div>
        <div id="palette-wrapper">
            <div id="palette-tab" onclick="togglePalette()">HIDE PALETTE</div>
            <div id="palette-bar"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
